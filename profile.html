<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>
    <header>
        <div class="headerblock">
            <a href="index.html" class="logo">
                <img src="image/ChatGPT_Image_14_okt_2026_g__22_35_01 1.svg" width="112px" alt="логотип">
            </a>
            <div class="navigation">
                <a href="index.html" class="textnavigation">
                    <span class="navtext">Главная</span>
                    <img class="textline" src="image/d68aa71a7408517c40670a27b38b3cb3 4.svg" alt="">
                </a>
                <a href="index.html#pocimu" class="textnavigation">
                    <span class="navtext">Почему мы</span>
                    <img class="textline" src="image/d68aa71a7408517c40670a27b38b3cb3 4.svg" alt="">
                </a>
                <a href="index.html#seti" class="textnavigation">
                    <span class="navtext">Сеты</span>
                    <img class="textline" src="image/d68aa71a7408517c40670a27b38b3cb3 4.svg" alt="">
                </a>
                <a href="index.html#menuchka" class="textnavigation">
                    <span class="navtext">Меню</span>
                    <img class="textline" src="image/d68aa71a7408517c40670a27b38b3cb3 4.svg" alt="">
                </a>
            </div>
            <div class="iconnav">
                <a href="profile.html" class="iconn profile-trigger">
                    <img src="image/Vector.svg" width="26px" alt="профиль">
                </a>
                <a href="cart.html" class="iconn">
                    <img src="image/Vector (1).svg" width="29px" alt="корзина">
                </a>
            </div>
        </div>
        <div class="headerline"></div>
    </header>

    <main>
        <div class="profileblock">
            <a href="javascript:void(0);" class="closebtn" id="logoutBtn">
                <img src="image/Vector (3).svg" width="23px" height="23px" alt="выйти">
            </a>

            <div class="profiletop">
                <img src="image/Group (1).svg" width="122px" height="122px" alt="аватар" class="profileavatar">
                <div class="profiletext">
                    <p class="profilename">Загрузка...</p>
                    <p class="profilephone"></p>
                </div>
            </div>

            <p class="orderstitle">Мои заказы</p>
            <button class="knop1 reviewbtn">Оставить отзыв</button>
        </div>
    </main>

    <div class="modaloverlay" id="reviewModal">
        <div class="modalblock regmodal reviewmodalblock">
            <h2 class="modaltitle">Ваш отзыв</h2>
            <form class="modalform" id="reviewForm">
                <div class="rating-select">
                    <p class="rating-label">Ваша оценка:</p>
                    <div class="stars-container" id="starRating">
                        <img src="image/Star 6.svg" class="star" data-value="1" alt="звезда">
                        <img src="image/Star 6.svg" class="star" data-value="2" alt="звезда">
                        <img src="image/Star 6.svg" class="star" data-value="3" alt="звезда">
                        <img src="image/Star 6.svg" class="star" data-value="4" alt="звезда">
                        <img src="image/Star 6.svg" class="star" data-value="5" alt="звезда">
                    </div>
                </div>

                <textarea id="reviewText" class="modalinput reviewtextarea" placeholder="Поделитесь впечатлениями..."
                    maxlength="115"></textarea>

                <div class="charcount-wrapper">
                    <span id="charCount">0</span>/115
                </div>

                <button type="submit" class="knop1 modalknop reviewmodalknop">Отправить</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footerblock">
            <div class="logofooter">
                <img src="image/ChatGPT_Image_14_okt_2026_g__22_35_01 1.svg" width="112px" height="112px" alt="логотип">
            </div>
            <div class="infofooter">
                <div class="navfooter">
                    <p class="titlefooter">Навигация</p>
                    <a href="index.html" class="linkfooter">Главная</a>
                    <a href="index.html#pocimu" class="linkfooter">Почему мы</a>
                    <a href="index.html#seti" class="linkfooter">Сеты</a>
                    <a href="index.html#menuchka" class="linkfooter">Меню</a>
                </div>
                <div class="contactfooter">
                    <p class="titlefooter">Контакты</p>
                    <div class="contactitem">
                        <img src="image/Group 101.svg" width="16px" height="20.01px" alt="адрес">
                        <span class="contacttext">г. Оренбург, ул. Чкалова, д. 11</span>
                    </div>
                    <div class="contactitem">
                        <img src="image/Vector (2).svg" width="20px" height="20.01px" alt="телефон">
                        <span class="contacttext">+7 (999) 123-45-67</span>
                    </div>
                    <div class="contactitem">
                        <img src="image/Group 102.svg" width="19px" height="13.92px" alt="почта">
                        <span class="contacttext">sweetcurse@mail.ru</span>
                    </div>
                </div>
                <div class="schedulefooter">
                    <p class="titlefooter">Расписание</p>
                    <p class="scheduletext">Пн–Чт: 10:00–22:00</p>
                    <p class="scheduletext">Пт–Сб: 10:00–00:00</p>
                    <p class="scheduletext">Вс: 11:00–21:00</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/profile.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
